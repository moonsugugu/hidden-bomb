# 기존 C:\homeserver\cloudflared\config.yml의 마지막 catch-all( http_status:404 )보다
# 위쪽에 아래 두 ingress 항목을 추가하세요. tunnel/credentials-file은 기존 값을 유지합니다.
#
# 게임 서버 3203, 웹 3007을 씁니다. 3201·3202는 balance-mate가 쓰고 있습니다.
# 새 앱을 붙일 때는 `pm2 status`로 빈 포트를 먼저 확인하세요.

ingress:
  - hostname: hiddenbomb.moonsunezip.com
    path: ^/(v1/game|health)
    service: http://127.0.0.1:3203
  - hostname: hiddenbomb.moonsunezip.com
    service: http://127.0.0.1:3007
  - service: http_status:404
